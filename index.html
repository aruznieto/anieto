<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repositorio de publicaciones</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <h1>Publicaciones</h1>
      <p>Archivos disponibles para consulta y descarga.</p>
    </header>

    <section class="document-browser" aria-label="Explorador de publicaciones">
      <div class="browser-toolbar">
        <nav id="pathBar" class="path-bar" aria-label="Ruta actual"></nav>

        <div class="search-field">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar en todos los documentos"
          />
        </div>
      </div>

      <section id="fileList" class="file-list">
        <p>Cargando archivos...</p>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
