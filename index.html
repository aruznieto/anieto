<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repositorio de publicaciones</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Publicaciones</h1>
      <p>Archivos disponibles para consulta y descarga.</p>
    </header>

    <section class="toolbar">
      <input type="text" id="searchInput" placeholder="Buscar archivo o carpeta..." />
    </section>

    <section id="fileList" class="file-list">
      <p>Cargando archivos...</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
